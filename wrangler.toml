name = "hamara"
main = "src/index.ts"
compatibility_date = "2024-11-27"

[[d1_databases]]
binding = "DB"
database_name = "hamara-db"
database_id = "REPLACE_WITH_D1_ID"

[vars]
# Telegram user id allowed to use the bot/mini-app (allowlist, single user for now)
ALLOWED_TELEGRAM_ID = "REPLACE_WITH_TELEGRAM_ID"
# Secrets (set with `wrangler secret put`, never commit):
# TELEGRAM_BOT_TOKEN
# TELEGRAM_WEBHOOK_SECRET
